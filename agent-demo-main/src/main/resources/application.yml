server:
  port: 9999
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: AgentDemo
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
  mvc:
    async:
      request-timeout: 300000
  ai:
    dashscope:
      api-key: sk-18ef5769878142bfbb75b3f7a0f3a823
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          top_p: 0.8
    mcp:
      client:
        enabled: true
        name: agent-demo-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        sse:
          connections:
            agent-demo-mcp-server:
              url: http://localhost:9527
              # sse-endpoint 默认就是 /sse，和 MCP Server 配置对齐

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://36.150.236.251:3337/agent_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis 配置
  data:
    redis:
      host: 36.150.236.251
      port: 6379
      database: 0
      timeout: 10000ms
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wzh.agentdemo.common.entity,com.wzh.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO 配置
minio:
  endpoint: http://36.150.236.251:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: agent-demo

milvus:
  host: 10.82.13.61
  port: 19530
  collection-name: feature_document_vectors
  faq-collection-name: faq_vectors

dashscope:
  api-key: sk-18ef5769878142bfbb75b3f7a0f3a823
  embedding-model: text-embedding-v3
  chat-model: qwen-plus
  vision-model: qwen-vl-max
  video-model: qwen3.5-plus

# Knife4j 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    root: info
    com.wzh.agentdemo: info

ticket-system:
  base-url: http://localhost:8081        # 工单系统地址
  api-key: capybara        # 与工单系统 application.yml 中的 ticket.api-key 保持一致

internal:
  api-key: internal-secret-key-change-me   # 必须和 mcp-server 的 main-app.internal-api-key 保持一致

rag:
  rerank:
    # 是否启用 reranker (评估接口可手动选 baseline 或 reranker,这里只是开关默认值)
    enabled: true
    # 模型: gte-rerank-v2 (推荐,中英文,relevance_score 区分度好)
    #       qwen3-rerank (新版,质量略好但价格略高)
    model: gte-rerank-v2
    # API 端点
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    # 粗召回 top-K (送给 reranker 的候选数)
    recall-top-k: 20
    # 精排后保留 top-N
    rerank-top-n: 5
    # 单条文档截断长度 (字符数,API 限制 4000 token,中文按 1.5 倍预留)
    max-doc-chars: 2500
    # HTTP 超时
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    # 失败时是否降级到 baseline (强烈建议 true)
    fallback-on-error: true
  rewrite:
    # 是否启用 query 改写
    enabled: true
    # 改写模型 (qwen-turbo 速度优先,qwen-plus 质量更好但更贵)
    model: qwen-turbo
    # 生成几条改写 (不含原 query;总检索路数 = num + 1)
    num-rewrites: 2
    # LLM 温度 — 改写是确定性场景,设低一点
    temperature: 0.3
    # LLM 输出最大 token
    max-tokens: 200
    # LLM 调用超时
    timeout-ms: 5000
    # 单路检索的 top-K
    recall-top-k: 15
    # RRF 融合参数 (业界标准 60)
    rrf-k: 60
    # 失败时降级到 baseline (强烈建议 true)
    fallback-on-error: true
    # 并行检索线程池大小
    thread-pool-size: 4
  prod:
    feature-aware-enabled: true
    feature-extract-enabled: true
    rewriting-fallback-enabled: true
    reranker-enabled: true
    final-top-k: 8
    feature-aware-top-k: 8
    temperature: 0.1
    max-tokens: 100

# ==================================================================
# 意图识别配置
# 文件位置: agent-demo-main/src/main/resources/application.yml
# 追加到现有 yml 末尾, 与 dashscope/milvus/spring 平级
# ==================================================================
intent:
  classifier:
    # LLM 兜底开关. true = 关键词未命中时调 qwen-turbo;  false = 直接降级 DEFAULT
    llm-fallback-enabled: true
    # LLM 兜底模型 (qwen-turbo 性价比最高)
    llm-model: qwen-turbo
    # LLM 调用超时 (毫秒). 超时直接降级, 不阻塞用户对话
    llm-timeout-ms: 3000
    # 置信度阈值. LLM 返回置信度低于此值视为不可信, 降级为 DEFAULT
    confidence-threshold: 0.6

  keywords:
    # 操作指引意图: 用户想知道"怎么做"
    how_to:
      - 怎么
      - 如何
      - 怎样
      - 步骤
      - 操作
      - 在哪里
      - 怎么用

    # 故障排查意图: 用户报告错误/异常
    troubleshoot:
      - 报错
      - 失败
      - 无法
      - 不能
      - 不行
      - 出错
      - 异常
      - 崩溃
      - 卡住
      - 没反应
      - 没用
      - 找不到
      - 为什么

    # 功能介绍意图: 用户问"是什么"
    feature_intro:
      - 是什么
      - 什么是
      - 有什么用
      - 介绍
      - 功能介绍
      - 干什么的
      - 干啥的
      - 用来做什么
      - 用途

    # 闲聊意图: 与产品功能无关
    chitchat:
      - 你好
      - 您好
      - hi
      - hello
      - 谢谢
      - 感谢
      - 再见
      - 拜拜
      - 你是谁
      - 你叫什么
      - 早上好
      - 晚上好
      - 天气

    # 管理员指令意图 (第六刀 B5-b-1 引入): 询问知识库系统本身的元数据/运营统计/管理操作.
    # 路由层会结合 userRole=admin 决定是否真正进入 admin_agent, 非管理员降级到 knowledge_answer.
    #
    # 关键词选词原则:
    # 1. 全部 >= 3 字, 避免单字误触发 (如 "分析" 会撞 "如何分析报错")
    # 2. 完整词组而非碎片, 因为 KeywordIntentClassifier 用 String.contains 而非正则
    # 3. 与业务意图 (how_to/troubleshoot/feature_intro) 无重叠, 避免触发关键词冲突降级 LLM
    # 4. 撞车时分类器返回 null 交 LLM 仲裁是安全保险, 但仍以无撞车为目标
    admin_command:
      # 学习状态查询类
      - 没学习
      - 没有学习
      - 未学习
      - 未向量化
      - 学习进度
      - 学习状态
      - 学习情况
      # 触发学习操作类
      - 学习一下
      - 学习所有
      - 重新学习
      - 触发学习
      # 文档/视频元数据类
      - 有哪些文档
      - 文档列表
      - 文档统计
      - 视频列表
      # 知识库系统类
      - 知识库状态
      - 知识库数据
      # 统计/分析类
      - 使用情况
      - 本周统计
      - 本月统计
      - 问题排名
      - 问得最多
      - 用户满意度
      # 大屏/运营类
      - 大屏数据
      - 运营数据
      - 运营看板

# ============ FAQ 检索配置 (第四刀新增) ============
faq:
  retrieve:
    # FAQ 检索开关; false = FaqRetrieveNode 直接返回空 List, 不影响主流程
    enabled: true
    # 单路向量检索 top-K
    top-k: 3
    # 通用 FAQ 的 feature_name 标识 (沿用 AgentService.learnFaq 既定约定)
    general-marker: "通用FAQ"

# ============ Prometheus 查询客户端 (B4 引入) ============
# 大屏 KPI 卡 #2 (Graph 耗时) 和 #4 (今日 Token) 通过 PrometheusQueryClient
# HTTP 调 Prometheus query API 取数. 与 Grafana 共用同一个 Prometheus 实例,
# 保证两套 UI 看到的数据一致.
prometheus:
  # Prometheus 服务地址. 本地开发部署形态默认 localhost:9090.
  # 生产部署改为内网 service DNS, 如 http://prometheus.observability.svc:9090
  base-url: http://localhost:9090
  # 连接超时, 同机访问 1s 足够
  connect-timeout-ms: 1000
  # 读取超时, Grafana 默认 1.5s, 平衡用户体验与兜底
  read-timeout-ms: 1500

semantic-cache:
  enabled: true
  similarity-threshold: 0.92        # L2 语义命中余弦相似度阈值
  ttl-hours: 24                      # Redis TTL + MySQL expire_at
  feedback-threshold: 5              # feedback_score 达此分置 DEGRADED
  feedback-weight-dislike: 2         # 用户点踩权重
  feedback-weight-regenerate: 1      # 重新生成权重
  feedback-weight-ticket: 3          # 提交工单权重
  milvus-collection: semantic_cache_vectors